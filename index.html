<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puzik ai</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            background: #1e1e1e;
            border-bottom: 1px solid #333333;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .m {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .u {
            align-self: flex-end;
            background: #2b5278;
        }
        .a {
            align-self: flex-start;
            background: #252525;
        }
        #inp {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: #1e1e1e;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: #2c2c2c;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background: #3390ec;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>

<header>🤖 puzik ai</header>

<div id="chat">
    <div class="m a">Привет! Я puzik ai. Напиши мне что-нибудь!</div>
</div>

<div id="inp">
    <input id="p" type="text" placeholder="Напиши сообщение...">
    <button id="btn" type="button">Отпр.</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('p');
    const btn = document.getElementById('btn');

    let history = [
        { role: 'system', content: 'Тебя зовут puzik ai. Отвечай по-русски, кратко и по делу.' }
    ];

    function addMsg(text, isUser) {
        const div = document.createElement('div');
        div.className = 'm ' + (isUser ? 'u' : 'a');
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, true);
        input.value = '';
        history.push({ role: 'user', content: text });

        const loading = addMsg('puzik ai думает...', false);

        try {
            const response = await fetch('https://pollinations.ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: history,
                    model: 'openai',
                    private: true
                })
            });
            const reply = await response.text();
            loading.textContent = reply || 'Пустой ответ от ИИ.';
            history.push({ role: 'assistant', content: reply });
        } catch (err) {
            loading.textContent = 'Ошибка соединения с сервером ИИ (возможно, заблокирован провайдером).';
        }
    }

    btn.addEventListener('click', send);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') send();
    });
</script>
<script src="https://telegram.org"></script>
<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }
</script>
</body>
</html>
