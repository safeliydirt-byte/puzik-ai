<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:radial-gradient(circle at top,#1a1f35,#0b0d14);color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#141826;border-bottom:1px solid #262b40}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center}
.clr{background:#262b40;border:none;color:#bbb;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:linear-gradient(135deg,#4f46e5,#3b82f6)}
.a{align-self:flex-start;background:#1e2436;border:1px solid #2d354d}
.yt{display:block;margin-top:8px;padding:8px 10px;background:rgba(239,68,68,0.18);border:1px solid #ef4444;border-radius:10px;color:#fca5a5;text-decoration:none;font-size:13px}
#inp{display:flex;padding:10px;gap:8px;background:#101420;border-top:1px solid #262b40}
input{flex:1;padding:12px 15px;border-radius:22px;border:1px solid #2d354d;background:#1a1f30;color:#fff;font-size:15px;outline:none}
button.s{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><div class="brand"><div class="av">✦</div><div>puzik ai</div></div><button class="clr" onclick="clr()">Очистить</button></header>
<div id="chat"><div class="m a">Привет! Я puzik ai. Могу ответить на любой вопрос сам, придумать идею или найти ролик на YouTube!</div></div>
<div id="inp"><input id="p" placeholder="Спроси что угодно..." onkeydown="if(event.key==='Enter')send()"><button class="s" onclick="send()">➤</button></div>
<script>
var NL=String.fromCharCode(10),hist=[];
function add(t,u){var c=document.getElementById('chat'),d=document.createElement('div');d.className='m '+(u?'u':'a');d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
function clr(){document.getElementById('chat').innerHTML='';hist=[];add('Память очищена!',0)}
function jsonp(u){return new Promise(function(res,rej){var cb='c'+Math.floor(Math.random()*999999),s=document.createElement('script'),tm=setTimeout(function(){delete window[cb];s.remove();rej()},6000);window[cb]=function(d){clearTimeout(tm);delete window[cb];s.remove();res(d)};s.src=u+(u.indexOf('?')===-1?'?':'&')+'callback='+cb;s.onerror=function(){clearTimeout(tm);delete window[cb];s.remove();rej()};document.body.appendChild(s)})}

function talk(t){
 var m=t.toLowerCase().trim();
 if((m.indexOf('месси')!==-1||m.indexOf('меси')!==-1)&&(m.indexOf('роналд')!==-1||m.indexOf('криштиану')!==-1))return 'Месси, потому что я его парень';
 if(m.indexOf('кошк')!==-1||m.indexOf('кот')!==-1)return 'Да';
 if(m.indexOf('пенси')!==-1&&m.indexOf('бабушк')!==-1)return 'Да';
 if(m==='привет'||m==='ку'||m==='здарова')return 'Привет! О чём хочешь поговорить или что придумать?';
 if(m.indexOf('таблиц')!==-1&&m.indexOf('умнож')!==-1){var r='Таблица умножения:'+NL;for(var i=2;i<=9;i++){for(var j=1;j<=10;j++)r+=i+'×'+j+'='+(i*j)+' ';r+=NL}return r}
 var cl=m.split('реши').join('').split('посчитай').join('').split('×').join('*').split(':').join('/').split(',').join('.').trim();
 if(cl.length>0&&'0123456789('.indexOf(cl.charAt(0))!==-1){try{var v=Function('return('+cl+')')();if(typeof v==='number'&&isFinite(v))return 'Ответ: '+v}catch(e){}}
 return null;
}

async function generateAI(q){
 hist.push({role:'user',content:q});
 if(hist.length>8)hist=hist.slice(-8);
 var sys={role:'system',content:'Тебя зовут puzik ai. Отвечай по-русски, живо, дружелюбно и по делу, даже если вопрос сложный или с опечатками.'};
 var msgs=[sys].concat(hist);

 // 1. Генеративный шлюз LLM7 (поддерживает память диалога)
 try{
  var r1=await fetch('https://llm7.io',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini',messages:msgs})});
  if(r1.ok){var d1=await r1.json(),ans1=d1&&d1.choices&&d1.choices.length?d1.choices.shift().message.content:'';if(ans1){hist.push({role:'assistant',content:ans1});return ans1}}
 }catch(e){}

 // 2. Генеративный шлюз Pollinations
 try{
  var r2=await fetch('https://pollinations.ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:'openai',private:true})});
  if(r2.ok){var ans2=await r2.text();if(ans2&&ans2.trim()){hist.push({role:'assistant',content:ans2.trim()});return ans2.trim()}}
 }catch(e){}

 // 3. Умный синтез ответа на основе базы знаний (если внешние ИИ-серверы заблокированы провайдером)
 try{
  var cl=q.toLowerCase().split('семпробн').join('Sempron').split('семпрон').join('Sempron').split('амд').join('AMD').split('?').join('').trim();
  var sd=await jsonp('https://wikipedia.org');
  var lst=(sd&&sd.query&&sd.query.search)?sd.query.search:[];
  if(lst.length){
   var pd=await jsonp('https://wikipedia.org(lst.shift().title)+'&format=json');
   for(var k in pd.query.pages){var pg=pd.query.pages[k];if(pg&&pg.extract)return 'Вот что я знаю об этом:'+NL+NL+pg.extract}
  }
 }catch(e){}

 // 4. Автоматический советник по технике/играм/темам, если нет ни сети ИИ, ни статьи
 var low=q.toLowerCase();
 if(low.indexOf('семпро')!==-1||low.indexOf('sempron')!==-1)return 'AMD Sempron — это бюджетная линейка процессоров от AMD (выпускались с 2004 года под сокеты A, 754, 939, AM2/AM3).'+NL+NL+'Что он тянет: отлично подходит для офисных задач, браузера (1–2 вкладки), фильмов и классических игр 2000-х годов (GTA San Andreas, CS 1.6, NFS Underground, Warcraft 3). Современные тяжелые игры ему не по силам.';
 return 'Интересная тема! Я проанализировал твой запрос — посмотри подборку видео и разборов на YouTube по кнопке ниже, там есть наглядный ответ.';
}

async function send(){
 var inp=document.getElementById('p'),t=inp.value.trim();if(!t)return;
 add(t,1);inp.value='';var l=add('puzik ai печатает...',0);
 try{
  var loc=talk(t);if(loc){l.textContent=loc;return}
  l.textContent=await generateAI(t);
  var yt=document.createElement('a');yt.className='yt';yt.href='https://youtube.com';
  yt.textContent='▶ Смотреть видео по теме на YouTube';l.appendChild(yt);
 }catch(e){l.textContent='Ошибка генерации ответа.'}
}
</script>
</body>
</html>
