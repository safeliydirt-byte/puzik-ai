<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:radial-gradient(circle at top,#1a1f35,#0b0d14);color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#141826;border-bottom:1px solid #262b40}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center}
.clr{background:#262b40;border:none;color:#bbb;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:linear-gradient(135deg,#4f46e5,#3b82f6)}
.a{align-self:flex-start;background:#1e2436;border:1px solid #2d354d}
.yt{display:block;margin-top:8px;padding:8px 10px;background:rgba(239,68,68,0.18);border:1px solid #ef4444;border-radius:10px;color:#fca5a5;text-decoration:none;font-size:13px}
#inp{display:flex;padding:10px;gap:8px;background:#101420;border-top:1px solid #262b40}
input{flex:1;padding:12px 15px;border-radius:22px;border:1px solid #2d354d;background:#1a1f30;color:#fff;font-size:15px;outline:none}
button.s{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><div class="brand"><div class="av">✦</div><div>puzik ai</div></div><button class="clr" onclick="clr()">Очистить</button></header>
<div id="chat"><div class="m a">Привет! Я puzik ai. Понимаю любые вопросы и подбираю видео с YouTube!</div></div>
<div id="inp"><input id="p" placeholder="Спроси что угодно..." onkeydown="if(event.key==='Enter')send()"><button class="s" onclick="send()">➤</button></div>
<script>
var NL=String.fromCharCode(10);
function add(t,u){var c=document.getElementById('chat'),d=document.createElement('div');d.className='m '+(u?'u':'a');d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
function clr(){document.getElementById('chat').innerHTML='';add('Чат очищен!',0)}
function jsonp(u){return new Promise(function(res,rej){var cb='c'+Math.floor(Math.random()*999999),s=document.createElement('script'),tm=setTimeout(function(){delete window[cb];s.remove();rej()},7000);window[cb]=function(d){clearTimeout(tm);delete window[cb];s.remove();res(d)};s.src=u+(u.indexOf('?')===-1?'?':'&')+'callback='+cb;s.onerror=function(){clearTimeout(tm);delete window[cb];s.remove();rej()};document.body.appendChild(s)})}

function cleanQ(q){
 var s=' '+q.toLowerCase().split('?').join('').split('!').join('').split('.').join('').split(',').join('')+' ';
 var map=[['семпробн','Sempron'],['семпрон','Sempron'],['амд','AMD'],['интел','Intel'],['нвидиа','NVIDIA'],['джифорс','GeForce'],['радеон','Radeon'],['райзен','Ryzen'],['привет',''],['расскажи',''],['про',''],['характеристики',''],['что',''],['такое',''],['кто',''],['такой',''],['и',''],['тянет',''],['он','']];
 for(var i=0;i<map.length;i++){var p=map[i],a=p.slice(0,1).shift(),b=p.slice(1,2).shift();s=s.split(' '+a+' ').join(' '+b+' ')}
 return s.trim()||q;
}

function talk(t){
 var m=t.toLowerCase().trim();
 if((m.indexOf('месси')!==-1||m.indexOf('меси')!==-1)&&(m.indexOf('роналд')!==-1||m.indexOf('криштиану')!==-1))return 'Месси, потому что я его парень';
 if(m.indexOf('кошк')!==-1||m.indexOf('кот')!==-1)return 'Да';
 if(m.indexOf('пенси')!==-1&&m.indexOf('бабушк')!==-1)return 'Да';
 if(m==='привет'||m==='ку'||m==='здарова')return 'Привет! Чем могу помочь сегодня?';
 if(m.indexOf('как дела')!==-1)return 'Отлично! Готов отвечать на любые вопросы.';
 if(m.indexOf('сегодня')!==-1&&(m.indexOf('день')!==-1||m.indexOf('число')!==-1||m.indexOf('дата')!==-1))return 'Сегодня '+new Date().toLocaleDateString('ru-RU');
 if(m.indexOf('таблиц')!==-1&&m.indexOf('умнож')!==-1){var r='Таблица умножения:'+NL;for(var i=2;i<=9;i++){for(var j=1;j<=10;j++)r+=i+'×'+j+'='+(i*j)+' ';r+=NL}return r}
 var cl=m.split('реши').join('').split('посчитай').join('').split('×').join('*').split(':').join('/').split(',').join('.').trim();
 if(cl.length>0&&'0123456789('.indexOf(cl.charAt(0))!==-1){try{var v=Function('return('+cl+')')();if(typeof v==='number'&&isFinite(v))return 'Ответ: '+v}catch(e){}}
 return null;
}

async function wiki(lang,q){
 var b='https://'+lang+'.wikipedia.org/w/api.php';
 var sd=await jsonp(b+'?action=query&list=search&srlimit=2&srsearch='+encodeURIComponent(q)+'&format=json');
 var lst=(sd&&sd.query&&sd.query.search)?sd.query.search:[];
 if(!lst.length&&sd&&sd.query&&sd.query.searchinfo&&sd.query.searchinfo.suggestion){
  sd=await jsonp(b+'?action=query&list=search&srlimit=2&srsearch='+encodeURIComponent(sd.query.searchinfo.suggestion)+'&format=json');
  lst=(sd&&sd.query&&sd.query.search)?sd.query.search:[];
 }
 if(!lst.length)return null;
 var pd=await jsonp(b+'?action=query&prop=extracts|pageimages&pithumbsize=400&exintro=1&explaintext=1&titles='+encodeURIComponent(lst.shift().title)+'&format=json');
 for(var k in pd.query.pages){var pg=pd.query.pages[k];if(pg&&pg.extract)return{txt:pg.extract,img:pg.thumbnail?pg.thumbnail.source:null}}
 return null;
}

async function send(){
 var inp=document.getElementById('p'),t=inp.value.trim();if(!t)return;
 add(t,1);inp.value='';var l=add('puzik ai думает...',0);
 try{
  var loc=talk(t);if(loc){l.textContent=loc;return}
  var q=cleanQ(t),r=await wiki('ru',q)||await wiki('en',q);
  l.textContent=r?('Вот что я нашёл:'+NL+NL+r.txt):('Вот подборки и обзоры по запросу «'+q+'»:');
  if(r&&r.img){var im=document.createElement('img');im.src=r.img;im.style.cssText='max-width:100%;border-radius:10px;margin-top:8px;display:block';l.appendChild(im)}
  var yt=document.createElement('a');yt.className='yt';yt.href='https://youtube.com';
  yt.textContent='▶ Смотреть видео по теме «'+q+'» на YouTube';l.appendChild(yt);
 }catch(e){l.textContent='Ошибка поиска.'}
}
</script>
</body>
</html>
