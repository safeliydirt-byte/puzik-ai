<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#0b0f19;color:#e2e8f0;margin:0;display:flex;height:100vh}
#sb{width:210px;background:#0f1626;border-right:1px solid #1e293b;display:flex;flex-direction:column;padding:10px;gap:8px}
.nb{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.ci{padding:8px;border-radius:8px;font-size:13px;color:#94a3b8;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.act{background:#1e293b;color:#fff}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:12px 16px;border-bottom:1px solid #1e293b;font-weight:bold;display:flex;gap:10px;align-items:center}
#ch{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 15px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#1e293b}
.a{align-self:flex-start;background:#131b2e;border:1px solid #1e293b}
form{padding:10px;display:flex;gap:8px;border-top:1px solid #1e293b;margin:0}
input{flex:1;padding:11px 14px;border-radius:20px;border:1px solid #26334d;background:#131b2e;color:#fff;outline:none;font-size:15px}
button.s{padding:0 18px;border-radius:20px;border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
@media(max-width:600px){#sb{display:none}#sb.op{display:flex;position:fixed;top:0;bottom:0;left:0;z-index:9}}
</style>
</head>
<body>
<div id="sb">
    <button class="nb" type="button" onclick="nChat()">+ Новый чат</button>
    <div id="cl"></div>
</div>
<div id="mn">
    <header>
        <button type="button" onclick="tSB()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">☰</button>
        <span>puzik ai</span>
    </header>
    <div id="ch"></div>
    <form onsubmit="send(event)">
        <input id="p" type="text" placeholder="Спросить puzik ai..." autocomplete="off">
        <button class="s" type="submit">↑</button>
    </form>
</div>
<script>
var NL = String.fromCharCode(10);
var cs = [];
var id = '';

try {
    var saved = localStorage.getItem('pz');
    if (saved) cs = JSON.parse(saved);
} catch (e) {}

function tSB() {
    var s = document.getElementById('sb');
    s.className = s.className ? '' : 'op';
}

function save() {
    try { localStorage.setItem('pz', JSON.stringify(cs)); } catch (e) {}
}

function nChat() {
    id = 'c' + Date.now();
    cs.unshift({ i: id, t: 'Новый чат', m: [{ r: 'a', x: 'Привет! Я puzik ai. Ищу ответы по всем сайтам интернета — задавай любой вопрос!' }] });
    save();
    draw();
}

function cur() {
    for (var k = 0; k < cs.length; k++) {
        if (cs.at(k).i === id) return cs.at(k);
    }
    return cs.at(0);
}

function draw() {
    if (!cs || !cs.length) return nChat();
    if (!id) id = cs.at(0).i;

    var l = document.getElementById('cl');
    l.innerHTML = '';
    for (var k = 0; k < cs.length; k++) {
        (function(c) {
            var d = document.createElement('div');
            d.className = 'ci' + (c.i === id ? ' act' : '');
            d.textContent = c.t;
            d.onclick = function() {
                id = c.i;
                draw();
                document.getElementById('sb').className = '';
            };
            l.appendChild(d);
        })(cs.at(k));
    }

    var b = document.getElementById('ch');
    b.innerHTML = '';
    var activeChat = cur();
    for (var j = 0; j < activeChat.m.length; j++) {
        var msg = activeChat.m.at(j);
        var div = document.createElement('div');
        div.className = 'm ' + msg.r;
        div.textContent = msg.x;
        b.appendChild(div);
    }
    b.scrollTop = b.scrollHeight;
}

function loc(t) {
    var m = t.toLowerCase().trim();
    if ((m.indexOf('месси') > -1 || m.indexOf('меси') > -1) && (m.indexOf('роналд') > -1 || m.indexOf('криштиану') > -1)) return 'Месси, потому что я его парень';
    if (m.indexOf('кошк') > -1 || m.indexOf('кот') > -1) return 'Да';
    if (m.indexOf('пенси') > -1 && m.indexOf('бабушк') > -1) return 'Да';
    if (m === 'привет' || m === 'ку' || m === 'здарова') return 'Привет! Чем помочь?';
    if (m.indexOf('как дела') > -1) return 'Отлично! Готов искать любую информацию по всему вебу.';
    if (m.indexOf('таблиц') > -1 && m.indexOf('умнож') > -1) {
        var r = '';
        for (var i = 2; i < 10; i++) {
            for (var j = 1; j < 11; j++) r += i + '*' + j + '=' + (i * j) + ' ';
            r += NL;
        }
        return r;
    }
    if ('0123456789('.indexOf(m.charAt(0)) > -1) {
        try { return 'Ответ: ' + Function('return(' + m.split(':').join('/').split(',').join('.') + ')')(); } catch (e) {}
    }
    return null;
}

function searchAllWeb(q, bm) {
    var finished = false;
    var results = [];

    function done(text) {
        if (finished) return;
        finished = true;
        bm.x = text;
        save();
        draw();
    }

    // 1. Поиск по всем сайтам через веб-выдачу DuckDuckGo Lite (через прокси AllOrigins)
    var ddgUrl = 'https://duckduckgo.com' + encodeURIComponent(q);
    var xhrWeb = new XMLHttpRequest();
    xhrWeb.open('GET', 'https://allorigins.win' + encodeURIComponent(ddgUrl), true);
    xhrWeb.timeout = 5000;
    xhrWeb.onreadystatechange = function() {
        if (xhrWeb.readyState === 4 && xhrWeb.status === 200) {
            try {
                var json = JSON.parse(xhrWeb.responseText);
                if (json && json.contents) {
                    var doc = new DOMParser().parseFromString(json.contents, 'text/html');
                    var snippets = doc.querySelectorAll('.result-snippet');
                    var titles = doc.querySelectorAll('.result-link');
                    var webParts = [];
                    var max = Math.min(3, snippets.length);
                    for (var i = 0; i < max; i++) {
                        var head = titles.item(i) ? titles.item(i).textContent.trim() : 'Сайт';
                        var body = snippets.item(i).textContent.trim();
                        if (body) webParts.push('• ' + head + ':' + NL + body);
                    }
                    if (webParts.length > 0) {
                        done('Вот что я нашёл на сайтах по твоему запросу:' + NL + NL + webParts.join(NL + NL));
                        return;
                    }
                }
            } catch (e) {}
        }
    };
    xhrWeb.send();

    // 2. Параллельный резерв: поиск по энциклопедии (если веб-выдача задерживается)
    var xhrWiki = new XMLHttpRequest();
    xhrWiki.open('GET', 'https://wikipedia.org' + encodeURIComponent(q) + '&format=json&origin=*', true);
    xhrWiki.timeout = 4500;
    xhrWiki.onreadystatechange = function() {
        if (xhrWiki.readyState === 4 && xhrWiki.status === 200) {
            try {
                var d = JSON.parse(xhrWiki.responseText);
                var list = (d && d.query && d.query.search) ? d.query.search : [];
                if (list.length) {
                    var title = list.at(0).title;
                    var xhrW2 = new XMLHttpRequest();
                    xhrW2.open('GET', 'https://wikipedia.org' + encodeURIComponent(title), true);
                    xhrW2.onreadystatechange = function() {
                        if (xhrW2.readyState === 4 && xhrW2.status === 200) {
                            try {
                                var d2 = JSON.parse(xhrW2.responseText);
                                if (d2 && d2.extract) {
                                    // Ждем 1.2 сек: если веб-сайты не успеют ответить быстрее, отдаем статью
                                    setTimeout(function() {
                                        done(d2.extract);
                                    }, 1200);
                                }
                            } catch (e) {}
                        }
                    };
                    xhrW2.send();
                }
            } catch (e) {}
        }
    };
    xhrWiki.send();

    // 3. Таймер завершения через 5.5 секунд
    setTimeout(function() {
        done('Я просканировал сайты по запросу «' + q + '», но открытые источники не вернули точного текста. Попробуй переформулировать вопрос!');
    }, 5500);
}

function send(e) {
    if (e) e.preventDefault();
    var p = document.getElementById('p');
    var t = p.value.trim();
    if (!t) return;

    var c = cur();
    if (c.t === 'Новый чат') c.t = t.slice(0, 20);
    c.m.push({ r: 'u', x: t });
    p.value = '';

    var l = loc(t);
    if (l) {
        c.m.push({ r: 'a', x: l });
        save();
        return draw();
    }

    var bm = { r: 'a', x: 'puzik ai ищет на сайтах...' };
    c.m.push(bm);
    draw();

    searchAllWeb(t, bm);
}

draw();
</script>
</body>
</html>
