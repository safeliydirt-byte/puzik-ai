<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#0b0f19;color:#e2e8f0;margin:0;display:flex;height:100vh}
#sb{width:210px;background:#0f1626;border-right:1px solid #1e293b;display:flex;flex-direction:column;padding:10px;gap:8px}
.nb{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.ci{padding:8px;border-radius:8px;font-size:13px;color:#94a3b8;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.act{background:#1e293b;color:#fff}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:12px 16px;border-bottom:1px solid #1e293b;font-weight:bold;display:flex;gap:10px;align-items:center}
#ch{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 15px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#1e293b}
.a{align-self:flex-start;background:#131b2e;border:1px solid #1e293b}
form{padding:10px;display:flex;gap:8px;border-top:1px solid #1e293b;margin:0}
input{flex:1;padding:11px 14px;border-radius:20px;border:1px solid #26334d;background:#131b2e;color:#fff;outline:none;font-size:15px}
button.s{padding:0 18px;border-radius:20px;border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
@media(max-width:600px){#sb{display:none}#sb.op{display:flex;position:fixed;top:0;bottom:0;left:0;z-index:9}}
</style>
</head>
<body>
<div id="sb">
    <button class="nb" type="button" onclick="nChat()">+ Новый чат</button>
    <div id="cl"></div>
</div>
<div id="mn">
    <header>
        <button type="button" onclick="tSB()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">☰</button>
        <span>puzik ai 12</span>
    </header>
    <div id="ch"></div>
    <form onsubmit="send(event)">
        <input id="p" type="text" placeholder="Спросить puzik ai..." autocomplete="off">
        <button class="s" type="submit">↑</button>
    </form>
</div>
<script>
var NL = String.fromCharCode(10);
var cs = new Array();
var id = '';

try {
    var saved = localStorage.getItem('pz12');
    if (saved) cs = JSON.parse(saved);
} catch (e) {}

function getEl(arr, idx) {
    return arr.slice(idx, idx + 1).shift();
}

function tSB() {
    var s = document.getElementById('sb');
    s.className = s.className ? '' : 'op';
}

function save() {
    try { localStorage.setItem('pz12', JSON.stringify(cs)); } catch (e) {}
}

function nChat() {
    id = 'c' + Date.now();
    cs.unshift({ i: id, t: 'Новый чат', m: new Array({ r: 'a', x: 'Привет! Я puzik ai. Спрашивай о чём угодно!' }) });
    save();
    draw();
}

function cur() {
    for (var k = 0; k !== cs.length; k++) {
        var item = getEl(cs, k);
        if (item.i === id) return item;
    }
    return getEl(cs, 0);
}

function draw() {
    if (!cs || !cs.length) return nChat();
    if (!id) id = getEl(cs, 0).i;

    var l = document.getElementById('cl');
    l.innerHTML = '';
    for (var k = 0; k !== cs.length; k++) {
        (function(c) {
            var d = document.createElement('div');
            d.className = 'ci' + (c.i === id ? ' act' : '');
            d.textContent = c.t;
            d.onclick = function() {
                id = c.i;
                draw();
                document.getElementById('sb').className = '';
            };
            l.appendChild(d);
        })(getEl(cs, k));
    }

    var b = document.getElementById('ch');
    b.innerHTML = '';
    var activeChat = cur();
    for (var j = 0; j !== activeChat.m.length; j++) {
        var msg = getEl(activeChat.m, j);
        var div = document.createElement('div');
        div.className = 'm ' + msg.r;
        div.textContent = msg.x;
        b.appendChild(div);
    }
    b.scrollTop = b.scrollHeight;
}

function cleanQ(q) {
    var s = ' ' + q.toLowerCase().split('?').join(' ').split('!').join(' ').split('.').join(' ').split(',').join(' ') + ' ';
    var stop = 'привет,расскажи,подскажи,пожалуйста,что,такое,кто,такой,такая,почему,зачем,как,когда,где,сколько,можно,нужно,ли,вообще,найди,про,о,об,и,в,на,из,за,для,семпробн:Sempron,семпрон:Sempron,амд:AMD,интел:Intel,нвидиа:NVIDIA,бреста:Брест,каменца:Каменец'.split(',');
    for (var i = 0; i !== stop.length; i++) {
        var item = getEl(stop, i);
        if (item.indexOf(':') > -1) {
            var p = item.split(':');
            s = s.split(' ' + getEl(p, 0) + ' ').join(' ' + getEl(p, 1) + ' ');
        } else {
            s = s.split(' ' + item + ' ').join(' ');
        }
    }
    return s.replace(/\s+/g, ' ').trim() || q;
}

function loc(t) {
    var m = t.toLowerCase().trim();
    if ((m.indexOf('месси') > -1 || m.indexOf('меси') > -1) && (m.indexOf('роналд') > -1 || m.indexOf('криштиану') > -1)) return 'Месси, потому что я его парень';
    if (m.indexOf('кошк') > -1 || m.indexOf('кот') > -1) return 'Да';
    if (m.indexOf('пенси') > -1 && m.indexOf('бабушк') > -1) return 'Да';
    if (m === 'привет' || m === 'ку' || m === 'здарова') return 'Привет! Чем помочь?';
    if (m.indexOf('как дела') > -1) return 'Отлично! Готов отвечать на твои вопросы.';
    if (m.indexOf('семпро') > -1 || m.indexOf('sempron') > -1) return 'AMD Sempron — бюджетный процессор от AMD. Тянет офис, фильмы и классику 2000-х (GTA SA, CS 1.6, NFS Underground, Warcraft 3).';
    if (m.indexOf('таблиц') > -1 && m.indexOf('умнож') > -1) {
        var r = '';
        for (var i = 2; i !== 10; i++) {
            for (var j = 1; j !== 11; j++) r += i + '*' + j + '=' + (i * j) + ' ';
            r += NL;
        }
        return r;
    }
    if ('0123456789('.indexOf(m.charAt(0)) > -1) {
        try { return 'Ответ: ' + Function('return(' + m.split(':').join('/').split(',').join('.') + ')')(); } catch (e) {}
    }
    return null;
}

function searchStep(query, backupWord, doneFn) {
    var cb = 'w_' + Math.floor(Math.random() * 999999);
    var s = document.createElement('script');
    window[cb] = function(d) {
        s.remove();
        if (d && d.query && d.query.pages) {
            for (var k in d.query.pages) {
                if (d.query.pages[k].extract) {
                    doneFn(d.query.pages[k].extract);
                    return;
                }
            }
        }
        if (backupWord && backupWord !== query) {
            searchStep(backupWord, null, doneFn);
            return;
        }
        doneFn('По запросу «' + query + '» точной статьи не нашлось. Попробуй другое слово!');
    };
    s.onerror = function() { doneFn('Нет связи с базой.'); };
    s.src = 'https://wikipedia.org' + encodeURIComponent(query) + '&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&format=json&callback=' + cb;
    document.body.appendChild(s);
}

function send(e) {
    if (e) e.preventDefault();
    var p = document.getElementById('p');
    var t = p.value.trim();
    if (!t) return;

    var c = cur();
    if (c.t === 'Новый чат') c.t = t.slice(0, 20);
    c.m.push({ r: 'u', x: t });
    p.value = '';

    var l = loc(t);
    if (l) {
        c.m.push({ r: 'a', x: l });
        save();
        return draw();
    }

    var bm = { r: 'a', x: '...' };
    c.m.push(bm);
    draw();

    var cq = cleanQ(t);
    var words = cq.split(' ');
    var longest = '';
    for (var i = 0; i !== words.length; i++) {
        var w = getEl(words, i);
        if (w.length > longest.length) longest = w;
    }

    var finished = false;
    function finish(ans) {
        if (finished) return;
        finished = true;
        bm.x = ans;
        save();
        draw();
    }

    searchStep(cq, longest, finish);

    setTimeout(function() {
        finish('По запросу «' + cq + '» ответ не успел загрузиться. Попробуй ещё раз!');
    }, 3500);
}

draw();
</script>
</body>
</html>
