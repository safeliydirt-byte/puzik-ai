<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puzik ai</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            background: #1e1e1e;
            border-bottom: 1px solid #333333;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .m {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .u {
            align-self: flex-end;
            background: #2b5278;
        }
        .a {
            align-self: flex-start;
            background: #252525;
        }
        #inp {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: #1e1e1e;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: #2c2c2c;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background: #3390ec;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<header>🤖 puzik ai</header>

<div id="chat"></div>

<div id="inp">
    <input id="p" type="text" placeholder="Задай вопрос или введи задачу...">
    <button id="btn" type="button">Отпр.</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('p');
    const btn = document.getElementById('btn');

    function buildMultiplicationTable() {
        let lines = ['📊 Таблица умножения:'];
        for (let i = 2; i <= 9; i++) {
            let row = [];
            for (let j = 1; j <= 10; j++) {
                row.push(`${i}×${j}=${i * j}`);
            }
            lines.push(`На ${i}: ` + row.join(', '));
        }
        return lines.join('\n');
    }

    function addMsg(text, isUser) {
        const div = document.createElement('div');
        div.className = 'm ' + (isUser ? 'u' : 'a');
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    // Решатель математических задач, уравнений и примеров
    function solveMath(text) {
        let clean = text.toLowerCase()
            .replace(/^(реши|посчитай|вычисли|сколько будет|уравнение|пример)\s*[:=-]?\s*/i, '')
            .replace(/,/g, '.')
            .replace(/×/g, '*')
            .replace(/х/g, 'x')
            .replace(/:/g, '/')
            .trim();

        // 1. Проценты: "20% от 350" или "20 процентов от 350"
        const pctMatch = clean.match(/^(\d+(?:\.\d+)?)\s*(?:%|процент[а-я]*)\s*от\s*(\d+(?:\.\d+)?)$/);
        if (pctMatch) {
            const p = parseFloat(pctMatch[1]);
            const num = parseFloat(pctMatch[2]);
            const ans = (num * p) / 100;
            return `🧮 Решение:\n1) Находим 1% от ${num}: ${num} / 100 = ${num / 100}\n2) Умножаем на ${p}%: ${num / 100} × ${p} = ${ans}\n\n✅ Ответ: ${ans}`;
        }

        // 2. Линейные уравнения с одной переменной x (например: 2x + 5 = 15)
        if (clean.includes('=') && clean.includes('x')) {
            try {
                const sides = clean.split('=');
                if (sides.length === 2) {
                    const parseSide = (expr) => {
                        let norm = expr.replace(/\s+/g, '');
                        if (norm[0] !== '+' && norm[0] !== '-') norm = '+' + norm;
                        const terms = norm.match(/[+-][^+-]+/g) || [];
                        let coefX = 0, constant = 0;
                        for (let t of terms) {
                            if (t.includes('x')) {
                                let numStr = t.replace('*x', '').replace('x', '');
                                if (numStr === '+' || numStr === '') coefX += 1;
                                else if (numStr === '-') coefX -= 1;
                                else coefX += parseFloat(numStr);
                            } else {
                                constant += parseFloat(t);
                            }
                        }
                        return { coefX, constant };
                    };

                    const left = parseSide(sides[0]);
                    const right = parseSide(sides[1]);
                    const totalX = left.coefX - right.coefX;
                    const totalConst = right.constant - left.constant;

                    if (totalX !== 0 && !isNaN(totalX) && !isNaN(totalConst)) {
                        const xVal = Number((totalConst / totalX).toFixed(4));
                        return `🧮 Решение уравнения:\n${clean}\n\n1) Переносим слагаемые с x влево, числа вправо:\n${totalX}x = ${totalConst}\n2) Делим на ${totalX}:\nx = ${totalConst} / ${totalX}\n\n✅ Ответ: x = ${xVal}`;
                    }
                }
            } catch (e) {}
        }

        // 3. Обычные математические примеры (включая скобки, степени ^ и корень sqrt)
        let mathExpr = clean.replace(/\^/g, '**').replace(/sqrt\(/g, 'Math.sqrt(');
        if (/^[0-9+\-*/().\s*Mathsqrt]+$/.test(mathExpr) && /[0-9]/.test(mathExpr) && /[+\-*/]|sqrt/.test(mathExpr)) {
            try {
                const res = Function('"use strict"; return (' + mathExpr + ')')();
                if (typeof res === 'number' && isFinite(res)) {
                    const rounded = Number(res.toFixed(6));
                    return `🧮 Вычисление:\n${clean} = ${rounded}\n\n✅ Ответ: ${rounded}`;
                }
            } catch (e) {}
        }

        return null;
    }

    function getCustomReply(text) {
        const msg = text.toLowerCase().trim();

        // Секретные ответы
        if ((msg.includes('месси') || msg.includes('меси')) && (msg.includes('роналд') || msg.includes('криштиану'))) {
            return 'Месси, потому что я его парень';
        }
        if (msg.includes('кошк') || msg.includes('кот')) {
            return 'Да';
        }
        if (msg.includes('пенси') && msg.includes('бабушк')) {
            return 'Да';
        }

        // Дата и время
        if ((msg.includes('какой') || msg.includes('какое') || msg.includes('сегодня')) && (msg.includes('день') || msg.includes('число') || msg.includes('дата'))) {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return '📅 Сегодня: ' + now.toLocaleDateString('ru-RU', options);
        }
        if (msg.includes('сколько врем') || msg.includes('который час')) {
            const now = new Date();
            return '⏰ Сейчас: ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Таблица умножения
        if (msg.includes('таблиц') && msg.includes('умнож')) {
            return buildMultiplicationTable();
        }

        // Математический решатель
        const mathSolution = solveMath(text);
        if (mathSolution) return mathSolution;

        return null;
    }

    // Поиск по всему интернету (включая текстовые задачи и ответы)
    async function searchAllInternet(query) {
        let answers = [];

        // Если похоже на школьную задачу — добавляем к поиску слово "решение ответ"
        let searchQuery = query;
        if (query.length > 25 && /\d/.test(query)) {
            searchQuery = query + ' решение ответ';
        }

        try {
            const ddgSearchUrl = 'https://duckduckgo.com' + encodeURIComponent(searchQuery);
            const proxyUrl = 'https://allorigins.win' + encodeURIComponent(ddgSearchUrl);
            const res = await fetch(proxyUrl);
            if (res.ok) {
                const json = await res.json();
                if (json && json.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(json.contents, 'text/html');
                    const snippets = doc.querySelectorAll('.result-snippet');
                    const links = doc.querySelectorAll('.result-link');

                    for (let i = 0; i < Math.min(3, snippets.length); i++) {
                        const title = links[i] ? links[i].textContent.trim() : '';
                        const snippet = snippets[i].textContent.trim();
                        if (snippet) {
                            answers.push(`🔹 ${title}\n${snippet}`);
                        }
                    }
                }
            }
        } catch (e) {}

        // Дополняем справкой из Википедии для коротких запросов
        if (query.split(' ').length <= 4) {
            try {
                const clean = query.replace(/^(что такое|кто такой|кто такая|расскажи про|найди)\s+/i, '').replace(/[?!.]+$/, '').trim();
                const wikiSearch = `https://wikipedia.org{encodeURIComponent(clean)}&format=json&origin=*`;
                const wRes = await fetch(wikiSearch);
                const wData = await wRes.json();
if (wData && wData.query && wData.query.search && wData.query.search.length > 0) {
const pageTitle = wData.query.search[0].title;
const sumRes = await fetch(https://wikipedia.org{encodeURIComponent(pageTitle)});
if (sumRes.ok) {
const sumData = await sumRes.json();
if (sumData.extract) {
answers.unshift(📖 Справка (${sumData.title}):\n${sumData.extract});
}
}
}
} catch (e) {}
}
if (answers.length > 0) {
return '🌐 Нашёл решение и информацию в интернете:\n\n' + answers.join('\n\n');
}
return 'Не удалось загрузить ответ из сети. Попробуй переформулировать задачу или проверь интернет!';
}
async function askPuzik(text) {
const custom = getCustomReply(text);
if (custom) return custom;
const msg = text.toLowerCase().trim();
if (msg === 'привет' || msg === 'ку' || msg === 'здарова') {
return 'Привет! Я puzik ai. Решаю примеры, уравнения, задачи и ищу любую инфу по всему интернету!';
}
return await searchAllInternet(text);
}
async function send() {
const text = input.value.trim();
if (!text) return;
addMsg(text, true);
input.value = '';
btn.disabled = true;
const loading = addMsg('🔍 Решаю и ищу...', false);
try {
loading.textContent = await askPuzik(text);
} catch (err) {
loading.textContent = 'Ошибка при обработке запроса.';
} finally {
btn.disabled = false;
input.focus();
}
}
btn.addEventListener('click', send);
input.addEventListener('keydown', function(e) {
if (e.key === 'Enter') {
e.preventDefault();
send();
}
});



if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.expand();
}
