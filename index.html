<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>puzik ai</title>
<style>
body{font-family:sans-serif;background:#121212;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:14px;text-align:center;font-weight:bold;font-size:18px;background:#1e1e1e;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#2b5278}
.a{align-self:flex-start;background:#252525}
#inp{display:flex;padding:10px;gap:8px;background:#1e1e1e}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#2c2c2c;color:#fff;font-size:16px;outline:none}
button{padding:0 18px;border-radius:20px;border:none;background:#3390ec;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:0.5}
</style>
</head>
<body>
<header>🤖 puzik ai</header>
<div id="chat"></div>
<div id="inp"><input id="p" placeholder="Задай вопрос или задачу..."><button id="btn" type="button">Отпр.</button></div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('p'),btn=document.getElementById('btn');
function add(t,u){const d=document.createElement('div');d.className='m '+(u?'u':'a');d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}

function solveMath(t){
 let c=t.toLowerCase().replace(/^(реши|посчитай|вычисли|сколько будет|уравнение|пример)\s*[:=-]?\s*/i,'').replace(/,/g,'.').replace(/×/g,'*').replace(/х/g,'x').replace(/:/g,'/').trim();
 const pm=c.match(/^(\d+(?:\.\d+)?)\s*(?:%|процент[а-я]*)\s*от\s*(\d+(?:\.\d+)?)$/);
 if(pm){const p=parseFloat(pm.at(1)),n=parseFloat(pm.at(2));return `🧮 Решение:\n${n} × ${p}% = ${(n*p)/100}\n✅ Ответ: ${(n*p)/100}`}
 if(c.includes('=')&&c.includes('x')){
  const s=c.split('=');
  if(s.length===2){
   const ps=e=>{let n=e.replace(/\s+/g,'');if(n.at(0)!=='+'&&n.at(0)!=='-')n='+'+n;let kx=0,kc=0;for(let m of(n.match(/[+-][^+-]+/g)||[])){if(m.includes('x')){let v=m.replace('*x','').replace('x','');kx+=(v==='+'||v==='')?1:(v==='-'?-1:parseFloat(v))}else kc+=parseFloat(m)}return{kx,kc}};
   const l=ps(s.at(0)),r=ps(s.at(1)),tx=l.kx-r.kx,tc=r.kc-l.kc;
   if(tx!==0&&!isNaN(tx)&&!isNaN(tc))return `🧮 Решение:\n${tx}x = ${tc}\n✅ Ответ: x = ${Number((tc/tx).toFixed(4))}`;
  }
 }
 let ex=c.replace(/\^/g,'**').replace(/sqrt\(/g,'Math.sqrt(');
 if(/^[0-9+\-*/().\s*Mathsqrt]+$/.test(ex)&&/[0-9]/.test(ex)&&/[+\-*/]|sqrt/.test(ex)){
  try{const r=Function('"use strict";return('+ex+')')();if(typeof r==='number'&&isFinite(r))return `🧮 Решение:\n${c} = ${Number(r.toFixed(6))}\n✅ Ответ: ${Number(r.toFixed(6))}`}catch(e){}
 }
 return null;
}

function localReply(t){
 const m=t.toLowerCase().trim();
 if((m.includes('месси')||m.includes('меси'))&&(m.includes('роналд')||m.includes('криштиану')))return 'Месси, потому что я его парень';
 if(m.includes('кошк')||m.includes('кот'))return 'Да';
 if(m.includes('пенси')&&m.includes('бабушк'))return 'Да';
 if((m.includes('какой')||m.includes('какое')||m.includes('сегодня'))&&(m.includes('день')||m.includes('число')||m.includes('дата')))return '📅 Сегодня: '+new Date().toLocaleDateString('ru-RU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 if(m.includes('сколько врем')||m.includes('который час'))return '⏰ Сейчас: '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 if(m.includes('таблиц')&&m.includes('умнож')){let r=['📊 Таблица умножения:'];for(let i=2;i<=9;i++){let a=[];for(let j=1;j<=10;j++)a.push(`${i}×${j}=${i*j}`);r.push(`На ${i}: `+a.join(', '))}return r.join('\n')}
 return solveMath(t);
}

async function webSearch(q){
 let out=[],sq=(q.length>25&&/\d/.test(q))?q+' решение ответ':q;
 try{
  const r=await fetch('https://allorigins.win('https://duckduckgo.com));
  if(r.ok){const j=await r.json();if(j&&j.contents){const doc=new DOMParser().parseFromString(j.contents,'text/html'),sn=doc.querySelectorAll('.result-snippet'),lk=doc.querySelectorAll('.result-link');for(let i=0;i<Math.min(3,sn.length);i++){const tt=lk.item(i)?lk.item(i).textContent.trim():'',tx=sn.item(i).textContent.trim();if(tx)out.push(`🔹 ${tt}\n${tx}`)}}}
 }catch(e){}
 try{
  const cl=q.replace(/^(что такое|кто такой|кто такая|расскажи про|найди)\s+/i,'').replace(/[?!.]+$/,'').trim();
  const wr=await fetch(`https://wikipedia.org{encodeURIComponent(cl)}&format=json&origin=*`);
  const wd=await wr.json();const hit=wd&&wd.query&&wd.query.search?wd.query.search.at(0):null;
  if(hit){const sr=await fetch(`https://wikipedia.org{encodeURIComponent(hit.title)}`);if(sr.ok){const sd=await sr.json();if(sd.extract)out.unshift(`📖 ${sd.title}:\n${sd.extract}`)}}
 }catch(e){}
 return out.length?'🌐 Нашёл в интернете:\n\n'+out.join('\n\n'):'Ничего не нашлось. Попробуй написать запрос проще!';
}

async function send(){
 const t=inp.value.trim();if(!t)return;
 add(t,1);inp.value='';btn.disabled=true;
 const l=add('🔍 Ищу и решаю...',0);
 try{
  const loc=localReply(t);
  l.textContent=loc||(t.toLowerCase()==='привет'?'Привет! Я puzik ai. Задай любой вопрос или задачу!':await webSearch(t));
 }catch(e){l.textContent='Ошибка поиска.'}finally{btn.disabled=false;inp.focus()}
}
btn.onclick=send;
inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
</script>
<script src="https://telegram.org"></script>
<script>if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.expand();</script>
</body>
</html>
