<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
body{font-family:sans-serif;background:#121212;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:12px;text-align:center;font-weight:bold;font-size:18px;background:#1e1e1e;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#2b5278}
.a{align-self:flex-start;background:#252525}
#chips{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#181818;border-top:1px solid #2a2a2a}
.chip{background:#2c2c2c;color:#ddd;border:none;border-radius:14px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
#inp{display:flex;padding:10px;gap:8px;background:#1e1e1e}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#2c2c2c;color:#fff;font-size:16px;outline:none}
button.send{padding:0 18px;border-radius:20px;border:none;background:#3390ec;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>🤖 puzik ai (Википедия)</header>
<div id="chat"><div class="m a">Привет! Я puzik ai. Спроси меня о любом городе, человеке, событии или предмете — я найду ответ в Википедии!</div></div>
<div id="chips">
    <button class="chip" onclick="quick('Брест')">🏰 Брест</button>
    <button class="chip" onclick="quick('Каменецкая башня')">🗼 Каменец</button>
    <button class="chip" onclick="quick('Солнечная система')">🪐 Космос</button>
    <button class="chip" onclick="quick('Таблица умножения')">📊 Таблица</button>
</div>
<div id="inp">
    <input id="p" placeholder="Например: кто такой Илон Маск..." onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">Отпр.</button>
</div>
<script>
var NL = String.fromCharCode(10);

function add(t, u) {
    var c = document.getElementById('chat'), d = document.createElement('div');
    d.className = 'm ' + (u ? 'u' : 'a');
    d.textContent = t;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    return d;
}

function quick(text) {
    document.getElementById('p').value = text;
    send();
}

function jsonp(url) {
    return new Promise(function(resolve, reject) {
        var cb = 'wcb_' + Math.floor(Math.random() * 1000000);
        var s = document.createElement('script');
        var t = setTimeout(function() { delete window[cb]; s.remove(); reject(); }, 7000);
        window[cb] = function(d) { clearTimeout(t); delete window[cb]; s.remove(); resolve(d); };
        s.src = url + '&callback=' + cb;
        s.onerror = function() { clearTimeout(t); delete window[cb]; s.remove(); reject(); };
        document.body.appendChild(s);
    });
}

function getLocal(t) {
    var m = t.toLowerCase().trim();
    if ((m.indexOf('месси') !== -1 || m.indexOf('меси') !== -1) && (m.indexOf('роналд') !== -1 || m.indexOf('криштиану') !== -1)) return 'Месси, потому что я его парень';
    if (m.indexOf('кошк') !== -1 || m.indexOf('кот') !== -1) return 'Да';
    if (m.indexOf('пенси') !== -1 && m.indexOf('бабушк') !== -1) return 'Да';
    if (m === 'привет' || m === 'ку' || m === 'здарова') return 'Привет! Напиши любое слово или вопрос — я найду статью в Википедии!';
    if (m.indexOf('сегодня') !== -1 && (m.indexOf('день') !== -1 || m.indexOf('число') !== -1 || m.indexOf('дата') !== -1)) return '📅 Сегодня: ' + new Date().toLocaleDateString('ru-RU');
    if (m.indexOf('время') !== -1 || m.indexOf('который час') !== -1) return '⏰ Сейчас: ' + new Date().toLocaleTimeString('ru-RU');
    if (m.indexOf('таблиц') !== -1 && m.indexOf('умнож') !== -1) {
        var r = '📊 Таблица умножения:' + NL;
        for (var i = 2; i <= 9; i++) {
            for (var j = 1; j <= 10; j++) r += i + '×' + j + '=' + (i * j) + ' ';
            r += NL;
        }
        return r;
    }
    var clean = m.split('реши').join('').split('посчитай').join('').split('сколько будет').join('').split('×').join('*').split(':').join('/').split(',').join('.').trim();
    if (clean.length > 0 && '0123456789('.indexOf(clean.charAt(0)) !== -1) {
        try {
            var res = Function('return(' + clean + ')')();
            if (typeof res === 'number' && isFinite(res)) return '🧮 ' + clean + ' = ' + res;
        } catch (e) {}
    }
    return null;
}

async function wiki(q) {
    var low = q.toLowerCase();
    var stop = ['что', 'такое', 'кто', 'такой', 'такая', 'такие', 'расскажи', 'про', 'подскажи', 'пожалуйста', 'почему', 'зачем', 'когда', 'где', 'как', 'появился', 'основали', 'основан', 'история', 'основание', 'вообще', 'мне', 'о', 'об', 'в', 'на', 'из', 'за', 'новости'];
    var words = low.split('?').join('').split('!').join('').split('.').join('').split(',').join('').split(' ');
    var keys = [];
    for (var i = 0; i < words.length; i++) {
        var w = words[i];
        if (w === 'бреста' || w === 'бресте') w = 'Брест';
        if (w === 'минска' || w === 'минске') w = 'Минск';
        if (w === 'каменца' || w === 'каменце') w = 'Каменец';
        if (w.length > 2 && stop.indexOf(w) === -1) keys.push(w);
    }
    var search = keys.join(' ') || q;

    try {
        var sData = await jsonp('https://wikipedia.org' + encodeURIComponent(search) + '&format=json');
        if (sData && sData.query && sData.query.search && sData.query.search.length > 0) {
            var list = sData.query.search;
            var best = list.shift();
            var pData = await jsonp('https://wikipedia.org' + encodeURIComponent(best.title) + '&format=json');
            var ans = '';
            if (pData && pData.query && pData.query.pages) {
                for (var k in pData.query.pages) {
                    if (pData.query.pages[k] && pData.query.pages[k].extract) {
                        var txt = pData.query.pages[k].extract;
                        if (txt.length > 750) txt = txt.substring(0, 750) + '...';
                        ans = '📖 ' + pData.query.pages[k].title + ':' + NL + txt;
                    }
                }
            }
            if (list.length > 0 && ans) {
                ans += NL + NL + '🔎 Похожие темы: ';
                var others = [];
                for (var j = 0; j < Math.min(2, list.length); j++) others.push(list.slice(j, j + 1).shift().title);
                ans += others.join(', ');
            }
            if (ans) return ans;
        }
    } catch (e) {}

    return 'В Википедии по запросу «' + search + '» ничего не нашлось. Попробуй написать проще — одним или двумя словами (например: «Брестская крепость» или «Юрий Гагарин»)!';
}

async function send() {
    var inp = document.getElementById('p'), t = inp.value.trim();
    if (!t) return;
    add(t, 1);
    inp.value = '';
    var l = add('📖 Ищу в Википедии...', 0);
    try {
        l.textContent = getLocal(t) || await wiki(t);
    } catch (e) {
        l.textContent = 'Ошибка поиска в Википедии.';
    }
}
</script>
</body>
</html>
