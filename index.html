<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>puzik ai</title>
<style>
body{font-family:sans-serif;background:#121212;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:12px;text-align:center;font-weight:bold;font-size:18px;background:#1e1e1e;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#2b5278}
.a{align-self:flex-start;background:#252525}
#chips{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#181818;border-top:1px solid #2a2a2a}
.chip{background:#2c2c2c;color:#ddd;border:none;border-radius:14px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
#inp{display:flex;padding:10px;gap:8px;background:#1e1e1e}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#2c2c2c;color:#fff;font-size:16px;outline:none}
button.send{padding:0 18px;border-radius:20px;border:none;background:#3390ec;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>🤖 puzik ai v7</header>
<div id="chat"><div class="m a">Привет! Я puzik ai. Спрашивай о чём угодно своими словами — я пойму!</div></div>
<div id="chips">
    <button class="chip" onclick="quick('Погода в Каменце')">🌤 Погода</button>
    <button class="chip" onclick="quick('Курс доллара')">💵 Курс валют</button>
    <button class="chip" onclick="quick('Расскажи интересный факт')">💡 Факт</button>
    <button class="chip" onclick="quick('Таблица умножения')">📊 Таблица</button>
</div>
<div id="inp">
    <input id="p" placeholder="Напиши любой вопрос..." onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">Отпр.</button>
</div>
<script>
var NL = String.fromCharCode(10);

function add(t, u) {
    var c = document.getElementById('chat'), d = document.createElement('div');
    d.className = 'm ' + (u ? 'u' : 'a');
    d.textContent = t;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    return d;
}

function quick(text) {
    document.getElementById('p').value = text;
    send();
}

function getLocal(t) {
    var m = t.toLowerCase().trim();
    if ((m.indexOf('месси') !== -1 || m.indexOf('меси') !== -1) && (m.indexOf('роналд') !== -1 || m.indexOf('криштиану') !== -1)) {
        return 'Месси, потому что я его парень';
    }
    if (m.indexOf('кошк') !== -1 || m.indexOf('кот') !== -1) return 'Да';
    if (m.indexOf('пенси') !== -1 && m.indexOf('бабушк') !== -1) return 'Да';
    if (m.indexOf('сегодня') !== -1 && (m.indexOf('день') !== -1 || m.indexOf('число') !== -1 || m.indexOf('дата') !== -1)) {
        return '📅 Сегодня: ' + new Date().toLocaleDateString('ru-RU');
    }
    if (m.indexOf('время') !== -1 || m.indexOf('который час') !== -1) {
        return '⏰ Сейчас: ' + new Date().toLocaleTimeString('ru-RU');
    }
    if (m.indexOf('таблиц') !== -1 && m.indexOf('умнож') !== -1) {
        var r = '📊 Таблица умножения:' + NL;
        for (var i = 2; i <= 9; i++) {
            for (var j = 1; j <= 10; j++) r += i + '×' + j + '=' + (i * j) + ' ';
            r += NL;
        }
        return r;
    }
    var clean = m.split('реши').join('').split('посчитай').join('').split('сколько будет').join('').split('×').join('*').split(':').join('/').split(',').join('.').trim();
    if (clean.length > 0 && '0123456789('.indexOf(clean.charAt(0)) !== -1) {
        try {
            var res = Function('return(' + clean + ')')();
            if (typeof res === 'number' && isFinite(res)) return '🧮 ' + clean + ' = ' + res;
        } catch (e) {}
    }
    return null;
}

async function askSmart(q) {
    var low = q.toLowerCase();

    // 1. Погода в любом городе
    if (low.indexOf('погод') !== -1) {
        try {
            var city = low.split('погода').join('').split('погоду').join('').split('в ').join('').split('каменце').join('Каменец').split('бресте').join('Брест').split('минске').join('Минск').trim() || 'Каменец';
            var g = await (await fetch('https://open-meteo.com' + encodeURIComponent(city) + '&count=1&language=ru&format=json')).json();
            if (g.results && g.results.length) {
                var pl = g.results.shift();
                var w = await (await fetch('https://open-meteo.com' + pl.latitude + '&longitude=' + pl.longitude + '&current_weather=true')).json();
                if (w.current_weather) return '🌤 Погода (' + pl.name + '): ' + w.current_weather.temperature + ' °C, ветер ' + w.current_weather.windspeed + ' км/ч';
            }
        } catch (e) {}
    }

    // 2. Курс валют РБ
    if (low.indexOf('курс') !== -1 || low.indexOf('доллар') !== -1 || low.indexOf('евро') !== -1 || low.indexOf('валют') !== -1) {
        try {
            var u = await (await fetch('https://nbrb.by')).json();
            var eu = await (await fetch('https://nbrb.by')).json();
            var ru = await (await fetch('https://nbrb.by')).json();
            return '💵 Курс НБ РБ:' + NL + '🇺🇸 1 USD = ' + u.Cur_OfficialRate + ' BYN' + NL + '🇪🇺 1 EUR = ' + eu.Cur_OfficialRate + ' BYN' + NL + '🇷🇺 100 RUB = ' + ru.Cur_OfficialRate + ' BYN';
        } catch (e) {}
    }

    // 3. Попытка получить живой ответ от свободной нейросети
    try {
        var aiPrompt = encodeURIComponent('Ты дружелюбный умный помощник puzik ai. Ответь подробно и понятно на русском языке: ' + q);
        var aiRes = await fetch('https://pollinations.ai' + aiPrompt);
        if (aiRes.ok) {
            var aiText = await aiRes.text();
            if (aiText && aiText.trim().length > 2) return aiText.trim();
        }
    } catch (e) {}

    // 4. Умный поиск по всей базе знаний Википедии (если нейросеть заблокирована сетью)
    try {
        var stopWords = ['что', 'такое', 'кто', 'такой', 'такая', 'расскажи', 'про', 'подскажи', 'пожалуйста', 'почему', 'зачем', 'когда', 'где', 'как', 'появился', 'основан', 'история', 'основание', 'вообще', 'мне', 'о', 'об', 'в'];
        var words = low.split('?').join('').split('!').join('').split('.').join('').split(',').join('').split(' ');
        var keyWords = [];
        for (var i = 0; i < words.length; i++) {
            if (words[i].length > 2 && stopWords.indexOf(words[i]) === -1) keyWords.push(words[i]);
        }
        var searchStr = keyWords.join(' ') || q;
        var wd = await (await fetch('https://wikipedia.org' + encodeURIComponent(searchStr) + '&format=json&origin=*')).json();
        if (wd.query && wd.query.search && wd.query.search.length) {
            var hit = wd.query.search.shift();
            var sd = await (await fetch('https://wikipedia.org' + encodeURIComponent(hit.title))).json();
            if (sd.extract) return '📖 ' + sd.title + ':' + NL + sd.extract;
        }
    } catch (e) {}

    return 'Я пока не смог достать ответ из сети. Попробуй переформулировать вопрос или нажми на одну из кнопок подсказок внизу!';
}

async function send() {
    var inp = document.getElementById('p'), t = inp.value.trim();
    if (!t) return;
    add(t, 1);
    inp.value = '';
    var l = add('🤖 Думаю...', 0);
    try {
        l.textContent = getLocal(t) || await askSmart(t);
    } catch (e) {
        l.textContent = 'Ошибка соединения.';
    }
}
</script>
</body>
</html>
